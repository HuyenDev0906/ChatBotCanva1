<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="canva-shell">
        <div class="canva-embed-wrap">
            <iframe id="canvaFrame" loading="lazy" src="https://www.canva.com/design/DAHGv19_Kng/YcMYbKgoVYT-yD_LYlxa4g/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen" title="Canva preview"></iframe>
        </div>
        <div id="canvaFallback" class="canva-fallback" hidden>
            <p>Không thể hiển thị bản nhúng Canva.</p>
            <a href="https://www.canva.com/design/DAHGv19_Kng/YcMYbKgoVYT-yD_LYlxa4g/view" target="_blank" rel="noopener noreferrer">Mở Canva ở tab mới</a>
        </div>
    </div>

    <div class="chat-widget" id="chatWidget">
        <div class="chat-container" id="chatBoxPanel">
            <div class="chat-header">
                <span>Trợ Lý AI</span>
                <div class="chat-header-actions">
                    <button type="button" class="chat-minimize" id="chatMinimize" aria-label="Thu nhỏ chat">−</button>
                    <button type="button" class="chat-close" id="chatClose" aria-label="Đóng chat">×</button>
                </div>
            </div>
            <div class="chat-messages" id="chatBox">
                <div class="msg bot-msg">Xin chào! Mình là ChatBot AI. Bạn muốn hỏi gì nào?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Hỏi AI bất cứ điều gì...">
                <button type="button" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
         <button class="chat-toggle" id="chatToggle" type="button" aria-label="Mở chat AI">
            <svg class="chat-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <defs>
                    <linearGradient id="botShellGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#22d3ee" />
                        <stop offset="1" stop-color="#6366f1" />
                    </linearGradient>
                    <linearGradient id="botEarGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#a5f3fc" />
                        <stop offset="1" stop-color="#818cf8" />
                    </linearGradient>
                </defs>
                <path class="bot-antenna" d="M50 20v-7" />
                <circle class="bot-antenna-light" cx="50" cy="10" r="4" />
                <rect class="bot-ear" x="10" y="42" width="14" height="26" rx="7" />
                <rect class="bot-ear" x="76" y="42" width="14" height="26" rx="7" />
                <rect class="bot-head" x="20" y="22" width="60" height="58" rx="20" />
                <path class="bot-face-shine" d="M31 31c5-5 12-7 20-7" />
                <ellipse class="bot-eye" cx="39" cy="48" rx="4" ry="5" />
                <ellipse class="bot-eye" cx="61" cy="48" rx="4" ry="5" />
                <path class="bot-smile" d="M40 62c3 4 6 6 10 6s7-2 10-6" />
                <circle class="bot-cheek" cx="29" cy="59" r="2.5" />
                <circle class="bot-cheek" cx="71" cy="59" r="2.5" />
            </svg>
            <span class="chat-badge chat-outside-badge" id="chatOutsideBadge" hidden>AI đã trả lời</span>
            <span class="chat-notification" id="chatNotification" aria-hidden="true" hidden></span>
        </button>
    </div>
</body>
</html>
