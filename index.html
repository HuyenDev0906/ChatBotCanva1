<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#0e0f12" />
	<meta name="description" content="Cùng nhau chia sẻ – vượt qua bạo lực mạng ẩn danh." />
	<title>Chuyện của mình | Bạn không cô đơn </title>
	<link href="css/style.css" rel="stylesheet" />
	<script defer src="js/config.js"></script>
	<script defer src="js/chat.js"></script>
</head>
<body>
<main class="canva-embed-wrap" aria-label="Bản trình chiếu Canva">
	<iframe
		id="canvaFrame"
		title="Chuyện Của Mình — bản trình chiếu Canva"
		src="https://www.canva.com/design/DAHGv19_Kng/qKk5vxYJ54uJAF4iT3Z1xg/view?embed"
		allow="fullscreen">
	</iframe>
</main>
<div class="chat-widget" id="chatWidget">
<div class="chat-container" id="chatBoxPanel">
<div class="chat-header">
<span>Trợ Lý AI</span>
<div class="chat-header-actions">
<button aria-label="Thu nhỏ chat" class="chat-minimize" id="chatMinimize" type="button">−</button>
<button aria-label="Đóng chat" class="chat-close" id="chatClose" type="button">×</button>
</div>
</div>
<div class="chat-messages" id="chatBox">
<div class="msg bot-msg">Chào cậu! 🌿 Hôm nay của cậu thế nào? Có gì muốn tâm sự với tớ không?</div>
</div>
<button aria-label="Cuộn xuống tin nhắn mới nhất" class="chat-scroll-down" hidden id="chatScrollDown" type="button">
<svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
<path d="M12 4v15m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
</svg>
</button>
<div class="chat-input-area">
<input id="userInput" placeholder="Hỏi tớ bất cứ điều gì..." type="text"/>
<button onclick="sendMessage()" type="button">Gửi</button>
</div>
</div>
<button aria-label="Mở chat AI" class="chat-toggle" id="chatToggle" type="button">
<svg aria-hidden="true" class="chat-icon" focusable="false" viewbox="0 0 100 100">
<defs>
<lineargradient id="botShellGradient" x1="0" x2="1" y1="0" y2="1">
<stop offset="0" stop-color="#22d3ee"></stop>
<stop offset="1" stop-color="#6366f1"></stop>
</lineargradient>
<lineargradient id="botEarGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#a5f3fc"></stop>
<stop offset="1" stop-color="#818cf8"></stop>
</lineargradient>
</defs>
<path class="bot-antenna" d="M50 20v-7"></path>
<circle class="bot-antenna-light" cx="50" cy="10" r="4"></circle>
<rect class="bot-ear" height="26" rx="7" width="14" x="10" y="42"></rect>
<rect class="bot-ear" height="26" rx="7" width="14" x="76" y="42"></rect>
<rect class="bot-head" height="58" rx="20" width="60" x="20" y="22"></rect>
<path class="bot-face-shine" d="M31 31c5-5 12-7 20-7"></path>
<ellipse class="bot-eye" cx="39" cy="48" rx="4" ry="5"></ellipse>
<ellipse class="bot-eye" cx="61" cy="48" rx="4" ry="5"></ellipse>
<path class="bot-smile" d="M40 62c3 4 6 6 10 6s7-2 10-6"></path>
<circle class="bot-cheek" cx="29" cy="59" r="2.5"></circle>
<circle class="bot-cheek" cx="71" cy="59" r="2.5"></circle>
</svg>
<span class="chat-badge chat-outside-badge" hidden="" id="chatOutsideBadge">AI đã trả lời</span>
<span aria-hidden="true" class="chat-notification" hidden="" id="chatNotification"></span>
</button>
</div>
</body>
</html>
